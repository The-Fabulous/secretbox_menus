<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110e" media="(prefers-color-scheme: dark)">
  <title>Меню кофейни</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner" id="topbar"></div>
  </header>

  <main>
    <section class="container today" id="today" hidden>
      <div class="section-head">
        <h2 id="todayTitle">Сегодня в меню</h2>
        <span class="today-date" id="todayDate"></span>
      </div>
      <div class="specials" id="specials"></div>
    </section>

    <nav class="tabs-wrap" id="tabsWrap" aria-label="Разделы меню" hidden>
      <div class="container">
        <div class="tabs" id="tabs"></div>
      </div>
    </nav>

    <section class="container menu" id="menu">
      <div class="loading">Загружаем меню…</div>
    </section>

    <section class="container screen" id="screen" hidden></section>
  </main>

  <button class="cart-bar" id="cartBar" type="button" data-order hidden></button>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- api.js — единственное место, которое знает, откуда берутся данные (сейчас JSON, потом БД) -->
  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script src="modules/pickup.js"></script>
  <script src="modules/delivery.js"></script>
  <script src="app.js"></script>
</body>
</html>
